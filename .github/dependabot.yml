version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # System.Text.Json is a net48-only PackageReference in Core, deliberately
      # pinned to track the net8 in-box (shared-framework) version so both TFMs
      # serialize identically (see Core/TurboSuite.Core.csproj). A major bump
      # (9.x/10.x) would make the Revit 2024 net48 build diverge from the Revit
      # 2025 net8 build. Allow 8.0.x servicing patches; block major bumps.
      - dependency-name: "System.Text.Json"
        update-types: ["version-update:semver-major"]
      # System.Security.Cryptography.Pkcs is pinned in Core only to lift PDFsharp's
      # vulnerable transitive 8.0.1 to the patched 8.0.2 (see Core/TurboSuite.Core.csproj).
      # It is part of the .NET 8 Windows Desktop shared framework that Revit 2025 runs on,
      # so the 8.0.x line matches the host; a 10.x pin would ship assemblies newer than
      # the net8 host provides. Allow 8.0.x servicing patches; block major bumps.
      - dependency-name: "System.Security.Cryptography.Pkcs"
        update-types: ["version-update:semver-major"]
